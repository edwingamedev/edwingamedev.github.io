<div class="section-wrapper space-background">
    <section class="section contact" id="contact">
        <div>

            <h2 class="section-heading space-bg-color" id="chat-text">
                Contact
            </h2>

            <p class="paragraph-text justify-text space-bg-color">
                I'm open to opportunities, collaborations and conversations about game development.
            </p>

            <p class="paragraph-text contact-text justify-text space-bg-color">
                The best way to reach me is by email. You can also find my code and technical work on GitHub,
                my professional background on LinkedIn, and playable prototypes and game jam projects on Game Jolt.
            </p>

            <div class="contact-links space-bg-color">

                <span class="hint--bottom bottom-link" aria-label="Email">
                    <a
                        href="mailto:{{ site.email }}"
                        aria-label="Send me an email"
                    >
                        <i
                            class="head-icon fas fa-envelope"
                            aria-hidden="true"
                        ></i>
                    </a>
                </span>

                <span class="hint--bottom bottom-link" aria-label="GitHub">
                    <a
                        href="{{ site.github }}"
                        aria-label="GitHub"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <i
                            class="head-icon fab fa-github"
                            aria-hidden="true"
                        ></i>
                    </a>
                </span>

                <span class="hint--bottom bottom-link" aria-label="LinkedIn">
                    <a
                        href="{{ site.linkedin }}"
                        aria-label="LinkedIn"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <i
                            class="head-icon fab fa-linkedin"
                            aria-hidden="true"
                        ></i>
                    </a>
                </span>

                <span class="hint--bottom bottom-link" aria-label="Game Jolt">
                    <a
                        href="{{ site.gamejolt }}"
                        aria-label="Game Jolt"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <img
                            class="head-icon"
                            src="{{ site.gamejolt_pic }}"
                            alt=""
                            aria-hidden="true"
                            style="vertical-align: bottom;"
                            width="30"
                        >
                    </a>
                </span>

            </div>

        </div>
    </section>
</div>
