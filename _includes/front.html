<section class="head" id="front">
    <div class="head-inner-wrap">
        <div class="profile-pic-div animated">
            <a href="/" class="profile-pic-link">
                <img src="{{ site.logo }}" class="profile-pic" />
            </a>
        </div>
        <div class="head-name head-title animated" id="head-name">
            {{ site.title }}
        </div>
        <div class="head-punchline animated">
            {{ site.description }}
        </div>
    </div>
</section>
