<section class="head" id="front">
  <div class="head-inner-wrap hero-layout">
    <div class="hero-content">
      <p class="hero-eyebrow">Senior Game Developer</p>

      <h1 class="head-name head-title animated" id="head-name">Edwin Holanda</h1>

      <p class="head-punchline animated">
        I build games, develop systems, and solve interesting technical challenges along the way.
      </p>

      <div class="hero-actions">
        <a
          class="hero-button hero-button-primary"
          href="#projects"
        >
          View Work
        </a>

        <a
          class="hero-button hero-button-secondary"
          href="#contact"
        >

    <div class="hero-visual">
      <div class="profile-pic-div animated">
        <img
          src="{{ site.logo }}"
          class="profile-pic"
          alt=""
          aria-hidden="true"

      </div>
    </div>
