<div class="section-wrapper">
    <section class="miniature-grid-section" id="projects">

        <h2 class="section-heading" id="featured-projects-text">
            Projects
        </h2>

        <div class="miniature-grid">

            {% for project in site.projects %}
                {% if project.categories contains "featured" %}

                    <a
                        class="miniature-card"
                        href="{{ project.url }}"
                        aria-label="View project: {{ project.title }}"
                    >
                        <div
                            class="miniature-image"
                            style="background-image: url('{{ project.thumbnail }}')"
                            role="img"
                            aria-label="{{ project.title }} project thumbnail"
                        ></div>

                        <div class="miniature-info">
                            <h3 class="miniature-title">
                                {{ project.title }}
                            </h3>
                        </div>
                    </a>

                {% endif %}
            {% endfor %}

            <a
                class="miniature-more nav-links"
                href="/projects/"
            >
                And more...
            </a>

        </div>
    </section>
</div>
