<div class="section-wrapper">
  <section class="section projects projects-page" id="projects">
    <div class="projects-content">
      <header class="projects-page-header">
        <h1 class="section-heading" id="projects-title">Projects</h1>

        <p class="projects-page-description">
          A collection of games, experiments, and things I've built along the way.
        </p>
      </header>

      <div class="projects-grid">
        {% for project in site.projects %}
          {%
            include project-card.html
            project=project
          %}
        {% endfor %}
      </div>
    </div>
  </section>
</div>
