<div class="section-wrapper">
  <section class="section skills" id="skills">
    <div class="skills-content">
      <h2 class="section-heading" id="skills-title">Skills</h2>

      <div
        class="skills-tree-viewport"
        role="region"
        aria-label="Interactive skill tree"
      >
        <div class="skills-tree-canvas">
          <svg
            class="skills-tree-connections"
            aria-hidden="true"
          ></svg>

          <div
            class="skills-tree-root"
            data-node="root"
          >
            Skills
          </div>

          {% for group in site.data.skills %}
            <div
              class="skills-tree-branch"
              data-direction="{{ group.direction }}"
            >
              <h3
                class="skills-tree-category"
                data-node="category"
              >
                <span
                  class="skills-tree-category-icon"
                  data-icon="{{ group.icon }}"
                  aria-hidden="true"
                ></span>

                <span>{{ group.category }}</span>
              </h3>

              <ul class="skills-tree-nodes">
                {% for item in group.items %}
                  <li
                    class="skills-tree-node"
                    data-node="skill"
                  >
                    {{ item }}
                  </li>
                {% endfor %}
              </ul>
            </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </section>
</div>
